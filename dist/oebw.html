t textarea{padding-right:70px}.secret .btn{position:absolute;right:8px;top:8px}.acct-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.addr{font-family:var(--mono);font-size:.92rem;word-break:break-all}.badge{font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}.badge.signer{background:var(--ok-soft);color:var(--ok)}.badge.watch{background:var(--warn-soft);color:var(--warn)}.inline-form{display:flex;align-items:flex-end;gap:8px}.inline-form label{flex:1;margin-bottom:8px}.inline-form .btn{margin-bottom:8px}.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 12px;gap:2px}.seg label{margin:0;color:var(--text);font-size:.95rem}.seg input{position:absolute;opacity:0;pointer-events:none}.seg span{display:block;padding:6px 14px;border-radius:9px;cursor:pointer}.seg input:checked+span{background:var(--card);color:var(--accent);font-weight:700;box-shadow:0 1px 3px #0000001f}.seg input:focus-visible+span{outline:2px solid var(--accent)}.seg.small span{padding:4px 12px;font-size:.88rem}.sub{border-left:3px solid var(--accent-soft);padding-left:12px;margin-bottom:12px}#amountRow{position:relative}#amountRow .btn.link{position:absolute;right:0;top:0}.unit-input{display:flex;align-items:center;gap:8px}.unit-input input{flex:1}#amountUnit{color:var(--text);font-weight:600;min-width:3em}fieldset.fees{border:1px solid var(--line);border-radius:12px;padding:10px 14px 4px;margin:4px 0 12px}fieldset.fees legend{font-size:.88rem;color:var(--muted);padding:0 6px}dl.info{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:8px 0 12px;font-size:.92rem}dl.info dt{color:var(--muted)}dl.info dd{margin:0;word-break:break-all}dl.info dd.mono{font-family:var(--mono);font-size:.88rem}dl.info dd.good{color:var(--ok);font-weight:600}dl.info dd.bad{color:var(--danger);font-weight:600}.qr{text-align:center}.qr img{width:min(78vw,300px);height:auto;background:#fff;border-radius:12px;padding:6px;image-rendering:pixelated}.qr .hint{margin-top:6px}.status{border-radius:10px;padding:10px 12px;background:var(--field);border:1px solid var(--line);font-size:.92rem;word-break:break-word}.status.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.status.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}footer{max-width:680px;margin:6px auto 30px;padding:0 16px;text-align:center;font-size:.82rem;color:var(--muted)}footer p{margin:6px 0}#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:10;max-width:90vw}dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;border:none;border-radius:16px;padding:18px 20px;background:var(--card);color:var(--text);box-shadow:0 18px 50px #00000059}dialog::backdrop{background:#0a0c148c}dialog h3{margin:0 0 12px;font-size:1.08rem}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}.warnings{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}.warnings li{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 11px;font-size:.9rem}.warnings li.danger{background:var(--danger-soft);color:var(--danger)}.ack{display:flex;gap:8px;align-items:flex-start;color:var(--text)}.ack input{margin-top:4px}#pwIntro ul{margin:0 0 12px;padding-left:20px;font-size:.9rem}#pwIntro li{margin-bottom:6px}#pwIntro p{margin:0 0 10px;font-size:.92rem}progress{width:100%;height:10px}.video-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4 / 3}.video-wrap video,.video-wrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.vault-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}.vault-list li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}.vault-list .name{font-weight:600}.vault-list .row{margin:4px 0 0}:root{--accent: #c76a00;--accent-soft: #fff1df}@media(prefers-color-scheme:dark){:root{--accent: #f7a440;--accent-soft: #3a2a12;--accent-ink: #14100a}}.pill{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}.fee-row{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:0 12px;align-items:end}@media(max-width:520px){.fee-row{grid-template-columns:1fr}}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:999px;padding:5px 11px;cursor:pointer}.chip:hover{border-color:var(--accent)}.check{display:flex;gap:8px;align-items:center;color:var(--text)}.check input{margin:0}.sub-details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:4px 0 12px}.sub-details>summary{cursor:pointer;font-size:.92rem}.utxo-list,.history-list{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:6px}.utxo-list li label{display:flex;gap:10px;align-items:center;margin:0;color:var(--text);font-size:.88rem}.utxo-list .amt,.history-list .amt{font-family:var(--mono);font-weight:600;white-space:nowrap}.utxo-list .meta,.history-list .meta{color:var(--muted);font-size:.8rem;word-break:break-all}.history-list li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}.history-list .amt.in{color:var(--ok)}.history-list .amt.out{color:var(--danger)}.history-list .btn{grid-row:span 2}</style>

<body>
<noscript><p class="noscript">This wallet needs JavaScript. / 此錢包需要啟用 JavaScript。</p></noscript>

<header class="top">
  <div class="brand">
    <h1>Overdoing <span id="brandCoin">BTC</span> <span data-i18n="app.warm"></span></h1>
    <span class="ver">v2.0.0</span>
  </div>
  <div class="top-actions">
    <button id="btnScan" class="btn primary" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg><span data-i18n="scan.button"></span></button>
    <button id="btnLang" class="btn" type="button" lang="en">EN</button>
  </div>
</header>

<main>
  <section class="card" id="secNet">
    <h2><span class="step">1</span><span data-i18n="net.title"></span></h2>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="coin" value="btc" checked><span>Bitcoin</span></label>
      <label><input type="radio" name="coin" value="bch"><span>Bitcoin Cash</span></label>
    </div>
    <div class="grid2">
      <label><span data-i18n="net.network"></span><select id="netSel"></select></label>
      <label><span data-i18n="net.server"></span><input id="serverUrl" type="url" list="serverList" autocomplete="off" spellcheck="false"></label>
      <datalist id="serverList"></datalist>
    </div>
    <p class="hint" data-i18n="net.serverHint"></p>
  </section>

  <section class="card" id="secAccount">
    <h2><span class="step">2</span><span data-i18n="acct.title"></span></h2>
    <div id="acctInput">
      <label for="keyInput" data-i18n="acct.inputLabel"></label>
      <div class="secret">
        <textarea id="keyInput" class="masked" rows="3" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-i18n-ph="acct.inputPh"></textarea>
        <button id="btnReveal" class="btn small" type="button" data-i18n="acct.show"></button>
      </div>
      <p class="hint" data-i18n="acct.inputHint"></p>
      <div id="keyOpts" class="grid2" hidden>
        <label id="typeRow"><span data-i18n="acct.type"></span><select id="typeSel"></select></label>
        <label id="accountRow"><span data-i18n="acct.accountIndex"></span><input id="accountIndex" type="text" inputmode="numeric" value="0" autocomplete="off"></label>
        <label id="passRow" class="span2"><span data-i18n="acct.passphrase"></span><input id="passphrase" type="password" autocomplete="off" spellcheck="false" data-i18n-ph="acct.passphrasePh"></label>
        <label id="pathRow" class="span2"><span data-i18n="acct.customPath"></span><input id="customPath" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="acct.customPathPh"></label>
      </div>
      <div class="row">
        <button id="btnLoad" class="btn primary" type="button" data-i18n="acct.load"></button>
        <button id="btnVault" class="btn" type="button" data-i18n="acct.vault"></button>
      </div>
    </div>
    <div id="acctView" hidden>
      <div class="acct-head">
        <span id="acctBadge" class="badge"></span>
        <span id="acctType" class="pill"></span>
        <code id="acctOrigin" class="addr"></code>
      </div>
      <dl id="balanceBox" class="info" hidden>
        <dt data-i18n="acct.balance"></dt><dd id="balConfirmed"></dd>
        <dt data-i18n="acct.utxos"></dt><dd id="balUtxos"></dd>
        <dt data-i18n="acct.synced"></dt><dd id="balSynced"></dd>
      </dl>
      <p id="tokenNote" class="hint warn" hidden></p>
      <div class="row">
        <button id="btnSync" class="btn primary small" type="button" data-i18n="acct.sync"></button>
        <button id="btnReceive" class="btn small" type="button" data-i18n="acct.receive"></button>
        <button id="btnExport" class="btn small" type="button" data-i18n="acct.export"></button>
        <button id="btnSaveVault" class="btn small" type="button" data-i18n="acct.saveVault"></button>
        <button id="btnLogout" class="btn small" type="button" data-i18n="acct.logout"></button>
      </div>
      <p id="offlineHint" class="hint" data-i18n="acct.offlineHint"></p>
    </div>
  </section>

  <section class="card" id="secSend">
    <h2><span class="step">3</span><span data-i18n="send.title"></span></h2>
    <label><span data-i18n="send.to"></span><input id="toAddr" type="text" autocomplete="off" spellcheck="false"></label>
    <p id="toHint" class="hint"></p>
    <div id="amountRow">
      <label><span data-i18n="send.amount"></span>
        <span class="unit-input"><input id="amount" type="text" inputmode="decimal" autocomplete="off"><span id="amountUnit">BTC</span></span>
      </label>
      <button id="btnMax" class="btn link" type="button" data-i18n="send.max"></button>
    </div>
    <p id="maxNote" class="hint" hidden></p>
    <div class="fee-row">
      <label><span data-i18n="send.feeRate"></span><span class="unit-input"><input id="feeRate" type="text" inputmode="decimal" autocomplete="off"><span id="feeUnit">sat/vB</span></span></label>
      <div id="feeChips" class="chips"></div>
    </div>
    <label id="rbfRow" class="check"><input id="rbf" type="checkbox" checked><span data-i18n="send.rbf"></span></label>
    <details id="coinControl" class="sub-details">
      <summary data-i18n="send.coinControl"></summary>
      <p class="hint" data-i18n="send.coinControlHint"></p>
      <ul id="utxoList" class="utxo-list"></ul>
    </details>
    <button id="btnSend" class="btn primary big" type="button"></button>
  </section>

  <section class="card" id="secResult" hidden>
    <h2 id="resultTitle"></h2>
    <div id="resultQrBox" class="qr">
      <img id="resultQr" alt="QR code">
      <p id="resultQrInfo" class="hint"></p>
      <p id="resultHint" class="hint"></p>
    </div>
    <dl id="resultRows" class="info"></dl>
    <label><span data-i18n="res.content"></span><textarea id="resultText" rows="4" readonly spellcheck="false"></textarea></label>
    <div class="row">
      <button id="btnCopyResult" class="btn small" type="button" data-i18n="btn.copy"></button>
      <button id="btnBroadcast" class="btn primary" type="button" data-i18n="res.broadcast" hidden></button>
    </div>
    <div id="bcastStatus" class="status" hidden></div>
  </section>

  <details class="card" id="secHistory">
    <summary data-i18n="hist.title"></summary>
    <p id="historyEmpty" class="hint" data-i18n="hist.empty"></p>
    <ul id="historyList" class="history-list"></ul>
  </details>

  <details class="card" id="secAdv">
    <summary data-i18n="adv.title"></summary>
    <section>
      <h3 data-i18n="msg.title"></h3>
      <p class="hint" data-i18n="msg.hint"></p>
      <label><span data-i18n="msg.address"></span><select id="msgAddr"></select></label>
      <textarea id="msgInput" rows="3" spellcheck="false" data-i18n-ph="msg.ph"></textarea>
      <button id="btnSignMsg" class="btn" type="button"></button>
    </section>
    <section>
      <h3 data-i18n="verify.title"></h3>
      <p class="hint" data-i18n="verify.hint"></p>
      <textarea id="verifyInput" rows="5" spellcheck="false" data-i18n-ph="verify.ph"></textarea>
      <button id="btnVerify" class="btn" type="button" data-i18n="verify.button"></button>
    </section>
  </details>
</main>

<footer>
  <p><strong>Overdoing BTC Warm Wallet</strong> v2.0.0 · <a href="https://github.com/overdoingism/Overdoing-BTC-Warm-Wallet-V2" target="_blank" rel="noopener noreferrer">GitHub</a> · MIT</p>
  <p data-i18n="foot.credit"></p>
  <p class="warn-text" data-i18n="foot.disclaimer"></p>
  <p data-i18n="foot.libs"></p>
  <p><button id="btnClear" class="btn small" type="button" data-i18n="foot.clear"></button></p>
</footer>

<div id="toast" role="status" hidden></div>

<dialog id="dlgConfirm">
  <h3 id="cfTitle"></h3>
  <dl id="cfRows" class="info"></dl>
  <ul id="cfWarn" class="warnings"></ul>
  <div class="actions">
    <button class="btn" type="button" data-close="" data-i18n="btn.cancel"></button>
    <button id="cfOk" class="btn primary" type="button" data-close="ok"></button>
  </div>
</dialog>

<dialog id="dlgAlert">
  <h3 id="alTitle"></h3>
  <p id="alMsg" class="pre"></p>
  <div class="actions"><button class="btn primary" type="button" data-close="ok" data-i18n="btn.close"></button></div>
</dialog>

<dialog id="dlgPw">
  <h3 id="pwTitle"></h3>
  <div id="pwIntro"></div>
  <label id="pwNameRow"><span data-i18n="pw.name"></span><input id="pwName" type="text" autocomplete="off"></label>
  <label><span data-i18n="pw.password"></span><input id="pw1" type="password" autocomplete="new-password"></label>
  <label id="pw2Row"><span data-i18n="pw.again"></span><input id="pw2" type="password" autocomplete="new-password"></label>
  <label id="pwAckRow" class="ack"><input id="pwAck" type="checkbox"><span data-i18n="vault.ack"></span></label>
  <p id="pwErr" class="err-text"></p>
  <div class="actions">
    <button class="btn" type="button" data-close="" data-i18n="btn.cancel"></button>
    <button id="pwOk" class="btn primary" type="button" data-i18n="btn.ok"></button>
  </div>
</dialog>

<dialog id="dlgBusy">
  <p id="busyText"></p>
  <progress id="busyBar" max="1" value="0"></progress>
</dialog>

<dialog id="dlgScan">
  <h3 data-i18n="scan.title"></h3>
  <div class="video-wrap"><video id="scanVideo" playsinline muted></video><canvas id="scanOverlay"></canvas></div>
  <p id="scanStatus" class="hint"></p>
  <progress id="scanProgress" max="1" value="0" hidden></progress>
  <div class="row">
    <button id="btnScanSwitch" class="btn small" type="button" data-i18n="scan.switch"></button>
    <button id="btnScanImage" class="btn small" type="button" data-i18n="scan.image"></button>
    <input id="scanFile" type="file" accept="image/*" hidden>
  </div>
  <label><span data-i18n="scan.paste"></span><textarea id="scanText" rows="3" spellcheck="false" autocomplete="off"></textarea></label>
  <div class="actions">
    <button class="btn" type="button" data-close="" data-i18n="btn.close"></button>
    <button id="btnScanUse" class="btn primary" type="button" data-i18n="scan.use"></button>
  </div>
</dialog>

<dialog id="dlgVault">
  <h3 data-i18n="vault.title"></h3>
  <ul id="vaultList" class="vault-list"></ul>
  <p id="vaultEmpty" class="hint" data-i18n="vault.empty"></p>
  <div class="actions"><button class="btn" type="button" data-close="" data-i18n="btn.close"></button></div>
</dialog>

<dialog id="dlgQr">
  <h3 id="qrTitle"></h3>
  <div class="qr"><img id="qrImg" alt="QR code"><p id="qrInfo" class="hint"></p></div>
  <code id="qrText" class="addr"></code>
  <p id="qrHint" class="hint"></p>
  <div class="actions">
    <button id="btnQrCopy" class="btn" type="button" data-i18n="btn.copy"></button>
    <button id="btnQrAlt" class="btn" type="button" hidden></button>
    <button class="btn primary" type="button" data-close="ok" data-i18n="btn.close"></button>
  </div>
</dialog>
